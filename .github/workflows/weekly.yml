name: weekly-review-intel
on:
  push:
  schedule:
    - cron: "17 4 * * 1"        # Mondays 04:17 UTC (09:47 IST)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt && pytest -q
      - name: Fetch, classify, report
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          LLM_PAUSE_SECONDS: ${{ vars.LLM_PAUSE_SECONDS }}
        run: python run.py
      - name: Commit results
        if: github.event_name != 'push'
        run: |
          git config user.name "review-bot"
          git config user.email "review-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Weekly review intel $(date -u +%F)"
          git push
